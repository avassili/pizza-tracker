# Pizza Tracker — fully offline local stack (DESIGN.md §3.1).
#
# Deviation from DESIGN.md §3.1, intentional: the top-level `version: "3.8"`
# key is omitted. Compose v2 treats it as obsolete and prints
# "the attribute `version` is obsolete" on every single command. The schema is
# inferred from the file itself, so nothing is lost.

name: pizza-tracker-dev

services:
  app:
    # Pinned to a specific Debian base instead of the floating `:20` tag so
    # container rebuilds are reproducible. Node major stays on 20 per
    # DESIGN.md §3.1.
    image: mcr.microsoft.com/devcontainers/typescript-node:20-bookworm
    # Real PID 1 inside the container, so `next dev` and the DynamoDB wait
    # loop receive SIGTERM/SIGINT properly on rebuild and Ctrl-C.
    init: true
    volumes:
      - ..:/workspace:cached
      # Keep container-built node_modules (next-swc / esbuild native binaries)
      # off the host bind mount: much faster I/O on macOS/Windows and no
      # host-vs-container platform clashes.
      - pizza-tracker-node-modules:/workspace/node_modules
      # Persist bash history across rebuilds.
      - pizza-tracker-bashhistory:/commandhistory
    working_dir: /workspace
    command: sleep infinity
    environment:
      NODE_ENV: development
      # Local adapter switches (DESIGN.md §3.3) — DYNAMODB_ENDPOINT present
      # means "use DynamoDB Local, never touch AWS".
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_TABLE_NAME: PizzaTrackerDev
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local_dev_key
      AWS_SECRET_ACCESS_KEY: local_dev_secret
      AUTH_MODE: mock
      NOTIFICATION_DRIVER: console
      # Next.js
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      # 5173 (Vite) removed: this stack is Next.js App Router only.
      - "3000:3000"
    depends_on:
      # Deliberately NOT service_healthy: the amazon/dynamodb-local image ships
      # no curl/wget/bash TCP helpers, so a healthcheck there would either fail
      # permanently or block this container from ever starting. Readiness is
      # handled by .devcontainer/init-dynamodb.sh, which polls the endpoint with
      # retries before creating the table.
      dynamodb-local:
        condition: service_started

  dynamodb-local:
    # Pinned: `latest` is a moving target that can silently change FSM test
    # behaviour. 3.3.2 is the current release and shares the digest of `latest`.
    image: amazon/dynamodb-local:3.3.2
    container_name: pizza-tracker-dynamodb-local
    init: true
    # -sharedDb   : one database file for all credentials/regions
    # -inMemory   : throwaway state, wiped on every container recreate
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory", "-port", "8000"]
    ports:
      - "8000:8000"

volumes:
  pizza-tracker-node-modules:
  pizza-tracker-bashhistory:

